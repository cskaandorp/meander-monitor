# The Supabase API gateway, as nginx. Lifted from ../coastsnap/supabase.
#
# This replaces upstream's Envoy (previously Kong) container. The route map is
# a faithful copy of upstream's lds.template.yaml — supabase-js builds every URL
# from one origin plus these four prefixes, so they are a contract, not a
# preference. Getting a prefix or a rewrite wrong produces 404s from inside the
# client library with no useful message.
#
#   /auth/v1/      → auth:9999                          strip prefix
#   /rest/v1/      → rest:3000                          strip prefix
#   /storage/v1/   → storage:5000                       strip prefix
#   /realtime/v1/  → realtime:4000/socket/  (WebSocket) strip prefix, Host rewritten
#
# Deliberately NOT reproduced from upstream: the gateway-level `apikey` check.
# Every service behind this validates the JWT itself (PostgREST via
# PGRST_JWT_SECRET, GoTrue via GOTRUE_JWT_SECRET, storage via AUTH_JWT_SECRET),
# so the gateway is a router, not a security boundary. Row-level security is
# what actually protects the data.

server {
    listen 8000;
    server_name _;

    # Uploads are video from phones, sent BROWSER-DIRECT to storage (see
    # lib/supabase/upload-direct.ts) — they never pass through the Next app, so
    # this limit is the one that matters. The stack's cap is 100 MB. 0 disables
    # nginx's own cap so the storage service's FILE_SIZE_LIMIT is the single
    # place that decides — otherwise a file passes the app and dies here.
    client_max_body_size 0;

    # Resolve upstreams at request time rather than at startup. Without this
    # nginx refuses to boot whenever a backend container is not yet up, which
    # turns any single-service restart into a gateway outage.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ⚠️  Every route below strips its prefix with `rewrite ... break` and then
    # proxy_pass'es to a host with NO trailing URI. That shape is deliberate.
    #
    # The obvious form — `proxy_pass http://$upstream:3000/;` — is a trap when
    # the upstream is a VARIABLE (which it must be here, so nginx resolves
    # containers at request time instead of refusing to boot when one is down).
    # With a variable, nginx does not strip the location prefix and substitute:
    # it REPLACES the entire request URI with the literal URI given. Every
    # request then arrives at the backend as `/`. PostgREST answers 200 for
    # that (it is the OpenAPI root), so the setup looks like it works right
    # up until any real path 404s.
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Auth ──────────────────────────────────────────────────────────────
    location /auth/v1/ {
        set $upstream_auth auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /auth/v1/;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_auth:9999;
    }

    # ── PostgREST ─────────────────────────────────────────────────────────
    location /rest/v1/ {
        set $upstream_rest rest;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /rest/v1/;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_rest:3000;
    }

    # ── Storage ───────────────────────────────────────────────────────────
    # storage-api runs with REQUEST_ALLOW_X_FORWARDED_PATH, so it uses the
    # header below to build correct public URLs behind this prefix.
    location /storage/v1/ {
        set $upstream_storage storage;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /storage/v1/;
        rewrite ^/storage/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_storage:5000;
        proxy_request_buffering off;    # stream uploads rather than spool them
        # Image transforms (/storage/v1/render/image/...) are served by
        # storage-api itself, which proxies to imgproxy internally — so they
        # need no route of their own, they already match this location.
    }

    # Realtime's management/health API sits at /api, NOT under /socket — hence
    # a separate, longer-prefix location (nginx matches longest prefix first).
    # supabase-js never calls this; it is here for parity with upstream and
    # because it gives us a probe that proves the tenant resolved:
    #   curl -H "Authorization: Bearer $ANON_KEY" \
    #        http://host/realtime/v1/api/tenants/realtime-dev/health
    location /realtime/v1/api {
        set $upstream_realtime_api realtime-dev.supabase-realtime;
        proxy_set_header Host realtime-dev.supabase-realtime;
        proxy_set_header X-Forwarded-Prefix /realtime/v1/;
        rewrite ^/realtime/v1/api(.*)$ /api$1 break;
        proxy_pass http://$upstream_realtime_api:4000;
    }

    # ── Realtime (WebSocket) ──────────────────────────────────────────────
    # Two things here are easy to get wrong and fail identically (a 503 on the
    # handshake, no error text):
    #
    #  1. Host MUST be rewritten to realtime-dev.supabase-realtime. Realtime
    #     parses the tenant id out of the Host header's subdomain, and
    #     SEED_SELF_HOST seeds exactly one tenant: realtime-dev. Passing the
    #     browser's Host through means an unknown tenant.
    #  2. Upgrade/Connection must be forwarded, or the socket never upgrades
    #     and the client silently falls back to failing forever.
    #
    # The read timeout is long because an idle subscription is normal: a
    # visitor's page sits open waiting for their photo to finish processing.
    location /realtime/v1/ {
        set $upstream_realtime realtime-dev.supabase-realtime;
        proxy_set_header Host realtime-dev.supabase-realtime;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Prefix /realtime/v1/;
        rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
        proxy_pass http://$upstream_realtime:4000;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Anything else is a client bug, not a route we forgot — say so clearly
    # rather than proxying it somewhere confusing.
    location / {
        return 404 '{"error":"no such Supabase route"}';
        add_header Content-Type application/json always;
    }
}
